<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ff2d95">
<title>ViduOS ✦ happy birthday</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Caveat:wght@500;700&family=Pacifico&family=Pixelify+Sans:wght@400;600&family=Playfair+Display:ital,wght@0,600;1,500;1,800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&text=0123456789&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- decorative shapes (drawn for this site; not photos) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb3dc"/><stop offset=".55" stop-color="#ff2d95"/><stop offset="1" stop-color="#c4006a"/>
    </linearGradient>
    <linearGradient id="g-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#d9d3e6"/><stop offset=".55" stop-color="#8f86a6"/><stop offset="1" stop-color="#f3eefc"/>
    </linearGradient>
    <path id="lp" d="M50 53 C37 39 39 16 50 2 C61 16 63 39 50 53Z"/>
  </defs>

  <symbol id="i-spark" viewBox="0 0 100 100">
    <path fill="currentColor" d="M50 0C54 34 66 46 100 50 66 54 54 66 50 100 46 66 34 54 0 50 34 46 46 34 50 0Z"/>
  </symbol>

  <symbol id="i-star" viewBox="0 0 100 100">
    <path fill="currentColor" stroke="#fff" stroke-width="5" stroke-linejoin="round"
      d="M50 6 61.8 36.6 94.5 38.4 69 59 77.6 90.6 50 72.6 22.4 90.6 31 59 5.5 38.4 38.2 36.6Z"/>
    <path fill="#fff" opacity=".55" d="M50 16 57 37 43 37Z"/>
  </symbol>

  <symbol id="i-heart" viewBox="0 0 100 100">
    <path fill="currentColor" stroke="#fff" stroke-width="5" stroke-linejoin="round"
      d="M50 90C20 64 5 48 5 30 5 15 16 6 29 6 39 6 46 11 50 19 54 11 61 6 71 6 84 6 95 15 95 30 95 48 80 64 50 90Z"/>
    <ellipse cx="29" cy="26" rx="10" ry="6" fill="#fff" opacity=".7" transform="rotate(-30 29 26)"/>
  </symbol>

  <symbol id="i-fly" viewBox="0 0 100 80">
    <g fill="currentColor" stroke="#fff" stroke-width="3" stroke-linejoin="round">
      <path d="M50 38C40 8 8 0 4 20 1 36 24 46 50 38Z"/>
      <path d="M50 38C60 8 92 0 96 20 99 36 76 46 50 38Z"/>
      <path d="M50 40C30 44 14 54 22 68 30 80 46 66 50 40Z"/>
      <path d="M50 40C70 44 86 54 78 68 70 80 54 66 50 40Z"/>
    </g>
    <g fill="#fff" opacity=".8">
      <circle cx="20" cy="22" r="5"/><circle cx="80" cy="22" r="5"/>
      <circle cx="31" cy="60" r="3.5"/><circle cx="69" cy="60" r="3.5"/>
    </g>
    <ellipse cx="50" cy="40" rx="3.2" ry="17" fill="#7a0045"/>
    <path d="M49 25C46 14 42 10 38 9M51 25C54 14 58 10 62 9" stroke="#7a0045" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </symbol>

  <symbol id="i-lily" viewBox="0 0 100 100">
    <g fill="#fff0f8" stroke="#ff9fd0" stroke-width="1.6" stroke-linejoin="round">
      <use href="#lp" transform="rotate(30 50 50)"/>
      <use href="#lp" transform="rotate(150 50 50)"/>
      <use href="#lp" transform="rotate(270 50 50)"/>
    </g>
    <g fill="#ffb3dc" stroke="#fff" stroke-width="1.6" stroke-linejoin="round">
      <use href="#lp" transform="rotate(90 50 50)"/>
      <use href="#lp" transform="rotate(210 50 50)"/>
      <use href="#lp" transform="rotate(330 50 50)"/>
    </g>
    <g stroke="#e0218a" stroke-width="2.2" stroke-linecap="round" opacity=".8">
      <path d="M50 46V20" transform="rotate(90 50 50)"/>
      <path d="M50 46V20" transform="rotate(210 50 50)"/>
      <path d="M50 46V20" transform="rotate(330 50 50)"/>
    </g>
    <g stroke="#b7e07a" stroke-width="1.6" stroke-linecap="round">
      <path d="M50 50 38 34M50 50 62 34M50 50 34 54M50 50 66 54M50 50 44 68M50 50 56 68"/>
    </g>
    <g fill="#b8520a">
      <circle cx="38" cy="34" r="2.6"/><circle cx="62" cy="34" r="2.6"/><circle cx="34" cy="54" r="2.6"/>
      <circle cx="66" cy="54" r="2.6"/><circle cx="44" cy="68" r="2.6"/><circle cx="56" cy="68" r="2.6"/>
    </g>
    <circle cx="50" cy="50" r="4" fill="#d8f5a0"/>
  </symbol>

  <symbol id="i-bow" viewBox="0 0 100 74">
    <g fill="currentColor" stroke="#fff" stroke-width="3.5" stroke-linejoin="round">
      <path d="M47 42 33 71 44 62 51 46Z"/><path d="M53 42 67 71 56 62 49 46Z"/>
      <path d="M50 33C30 4 5 5 5 30 5 55 30 53 50 39Z"/>
      <path d="M50 33C70 4 95 5 95 30 95 55 70 53 50 39Z"/>
      <rect x="41" y="25" width="18" height="20" rx="7"/>
    </g>
    <path d="M14 22C18 14 28 13 34 20" stroke="#fff" stroke-width="3" fill="none" opacity=".7" stroke-linecap="round"/>
    <path d="M66 20C72 13 82 14 86 22" stroke="#fff" stroke-width="3" fill="none" opacity=".7" stroke-linecap="round"/>
  </symbol>
</svg>

<div class="room" aria-hidden="true"></div>

<main class="phone" id="phone">
  <div class="glitter"></div>
  <section id="boot" class="screen on"></section>
  <section id="call" class="screen"></section>
  <section id="wall" class="screen"></section>
  <section id="home" class="screen"></section>
  <section id="app"  class="screen"></section>
  <div id="dlg"></div>
  <div id="toast"></div>
  <div id="fx"></div>
  <canvas id="confetti"></canvas>
</main>

<audio id="audio" preload="none"></audio>

<noscript>this little universe needs JavaScript switched on 💗</noscript>
<script src="js/content.js"></script>
<script src="js/app.js"></script>
</body>
</html>
